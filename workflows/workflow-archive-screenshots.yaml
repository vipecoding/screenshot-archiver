id: bbfe2ba0-32b0-495f-bc01-47086d38a072
name: archive-screenshots
description: Nightly 03:15 workflow to scan and archive Desktop screenshots and screen recordings into Obsidian Daily YYYY/MM/DD folders
tags: {}
trigger:
  schedule: "15 3 * * *"
  catchUp:
    policy: latest
    maxDelay: 24h
jobs:
  - name: archive-desktop-screenshots
    description: Scan Desktop screenshots and archive eligible files (< today) with rsync checksum + SHA-256 verification
    steps:
      - name: scan
        description: Scan Desktop for eligible screenshots and screen recordings
        task:
          type: behavior
          behavior: screenshot-archiver
          methodName: scan
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: archive
        description: Copy eligible files via rsync, verify checksum + SHA-256, and remove from Desktop
        # In Swamp workflows, a truthy guard skips the step ("guarded").
        # Skip archive when scan found 0 eligible files (run archive only when eligibleCount > 0).
        guard: ${{ data.latest("screenshot-archiver", "main").attributes.eligibleCount == 0 }}
        task:
          type: behavior
          behavior: screenshot-archiver
          methodName: archive
        dependsOn:
          - step: scan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
